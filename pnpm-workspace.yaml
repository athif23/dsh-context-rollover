# Peers (@deepseek-ai/*) resolve from the host profile's shared module
# fallback at runtime, and from the sibling DSH checkout's tsconfig paths
# during local typecheck/tests — they are never auto-installed from a
# registry here. (npm reads .npmrc and warns on pnpm-only settings, which
# is why this lives here instead.)
autoInstallPeers: false
# pnpm v10+ no longer reads the "pnpm" field in package.json.
onlyBuiltDependencies:
  - esbuild
